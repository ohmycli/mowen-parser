name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Zig 0.16.0
      uses: mlugg/setup-zig@v2
      with:
        version: 0.16.0

    - name: Check formatting
      run: zig fmt --check src/ tests/

    - name: Build
      run: zig build

    - name: Run tests
      run: zig build test

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Zig 0.16.0
      uses: mlugg/setup-zig@v2
      with:
        version: 0.16.0

    - name: Check formatting
      run: zig fmt --check src/ tests/

    - name: Build debug
      run: zig build
